name: Build web dist

# 前端在 GitHub Runner 上构建，产物上传到固定 Release（tag `dist`）。
# 服务器只下载 web-dist-<sha>.tar.gz 并原子替换 web/dist，见 update.sh 与
# docs/reference/07-部署与运维.md §3.1。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只用于创建 Release 与上传/删除资产；不使用 PAT。
permissions:
  contents: write

# 同一 ref 只保留最新一次构建，push 新提交会取消仍在跑的旧任务。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package dist
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          COMMIT_SHA="$COMMIT_SHA" VERSION="$VERSION" BUILT_AT="$BUILT_AT" node -e '
          const fs = require("fs")
          const payload = {
            commit: process.env.COMMIT_SHA,
            version: process.env.VERSION,
            builtAt: process.env.BUILT_AT
          }
          fs.writeFileSync("web/dist/dist-info.json", JSON.stringify(payload, null, 2) + "\n")
          '
          ASSET="web-dist-${COMMIT_SHA}.tar.gz"
          tar -czf "$ASSET" -C web dist
          sha256sum "$ASSET" > "$ASSET.sha256"
          echo "打包完成：$ASSET"
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Ensure dist release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view dist >/dev/null 2>&1; then
            gh release create dist \
              --title "前端构建产物" \
              --notes "Vesta 前端构建产物。资产按 commit 命名：web-dist-<sha>.tar.gz 与 web-dist-<sha>.tar.gz.sha256；按 commit 成对保留最近 5 组（共 10 个资产）。由 .github/workflows/build.yml 自动维护。" \
              --latest=false
          fi

      - name: Upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload dist "$ASSET" "$ASSET.sha256" --clobber

      - name: Prune old assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/dist" --jq '.id')"
          # 按 commit 成对清理：web-dist-<sha>.tar.gz 与 web-dist-<sha>.tar.gz.sha256
          # 归为同一组，按组内最新 created_at 倒序，只保留最近 5 组（共 10 个资产），
          # 避免按单个资产截断时把同一次构建的 tar 与 sha 拆散。
          # --slurp 的输出形态随 gh 版本/页数变化（[[asset,...]] 或 [asset,...]），
          # 交给 Node 展平后再分组，避免 jq 对单页输出形态做 add 假设。
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --slurp > /tmp/release-assets.json
          node <<'NODE' > /tmp/prune-targets.tsv
          const fs = require("fs")
          const raw = fs.readFileSync("/tmp/release-assets.json", "utf8").trim()
          if (!raw) process.exit(0)
          const parsed = JSON.parse(raw)
          const pages = Array.isArray(parsed) ? parsed : []
          // 兼容按页嵌套的 [[asset,...],...] 与未嵌套的 [asset,...] 两种形态。
          const assets = pages.length > 0 && pages.every((page) => Array.isArray(page))
            ? pages.flat()
            : pages
          const nameRe = /^(.*)\.tar\.gz(\.sha256)?$/
          const groups = new Map()
          for (const asset of assets) {
            if (!asset || typeof asset.name !== "string") continue
            const match = nameRe.exec(asset.name)
            if (!match) continue
            const key = match[1]
            if (!groups.has(key)) groups.set(key, [])
            groups.get(key).push(asset)
          }
          const newest = (list) => Math.max(...list.map((asset) => Date.parse(asset.created_at) || 0))
          const ordered = [...groups.entries()]
            .map(([key, list]) => ({ key, list, newest: newest(list) }))
            .sort((a, b) => b.newest - a.newest || a.key.localeCompare(b.key))
          for (const group of ordered.slice(5)) {
            const sorted = [...group.list].sort((a, b) => String(a.name).localeCompare(String(b.name)))
            for (const asset of sorted) {
              process.stdout.write([asset.id, asset.name, asset.created_at || ""].join("\t") + "\n")
            }
          }
          NODE
          while IFS=$'\t' read -r id name created_at; do
            [ -n "$id" ] || continue
            echo "删除旧资产：$name（created_at $created_at）"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$id"
          done < /tmp/prune-targets.tsv
