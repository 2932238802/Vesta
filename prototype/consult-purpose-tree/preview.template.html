<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>七月咨询稿 · 目的树原型</title>
    <style>
      :root {
        --bg: #f6f2e9;
        --bg-2: #efe9dc;
        --surface: #fffdf8;
        --surface-2: #fbf8f0;
        --ink: #25241f;
        --ink-2: #5d584d;
        --ink-3: #8d8678;
        --line: #e3dbcb;
        --line-strong: #d4c9b3;
        --accent: #3d6b52;
        --accent-soft: #e5efe7;
        --amber: #a86c1f;
        --amber-soft: #f8ecd3;
        --amber-line: #d9b878;
        --gap: #9a9282;
        --gap-soft: #efebe1;
        --danger: #9a4a3a;
        --danger-soft: #f7e6e1;
        --shadow: 0 1px 2px rgba(45, 39, 27, 0.04), 0 8px 24px rgba(45, 39, 27, 0.05);
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 0%, rgba(255, 253, 248, 0.9), transparent 32%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      .topbar {
        max-width: 1560px;
        margin: 0 auto;
        padding: 26px 22px 12px;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: var(--accent);
        font-size: 11px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(24px, 3vw, 34px);
        font-weight: 560;
        letter-spacing: -0.03em;
      }

      .lede {
        max-width: 880px;
        margin: 9px 0 0;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1.75;
      }

      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 15px;
      }

      .stat {
        display: inline-flex;
        align-items: baseline;
        gap: 6px;
        padding: 5px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 253, 248, 0.72);
        color: var(--ink-3);
        font-size: 11px;
      }

      .stat b {
        color: var(--ink);
        font-size: 13px;
        font-weight: 580;
        font-variant-numeric: tabular-nums;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1.42fr) minmax(370px, 0.8fr);
        gap: 18px;
        max-width: 1560px;
        margin: 0 auto;
        padding: 8px 22px 30px;
        align-items: start;
      }

      .tree-pane {
        min-width: 0;
      }

      .toolbar {
        position: sticky;
        top: 0;
        z-index: 8;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(250, 247, 240, 0.92);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(8px);
      }

      .search {
        flex: 1 1 210px;
        min-width: 170px;
        height: 34px;
        padding: 0 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        font-size: 12.5px;
      }

      .search:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }

      .btn {
        height: 32px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink-2);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .btn:hover {
        border-color: var(--line-strong);
        color: var(--ink);
        background: #fff;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 4px;
        color: var(--ink-2);
        font-size: 12px;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
      }

      .toggle input {
        accent-color: var(--accent);
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 0 0 12px 2px;
        color: var(--ink-3);
        font-size: 11px;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 3px;
      }

      .dot.main {
        background: var(--accent);
      }

      .dot.optional {
        border: 1px dashed var(--amber);
        background: var(--amber-soft);
      }

      .dot.butterfly {
        border-radius: 999px;
        background: var(--amber-soft);
        box-shadow: inset 0 0 0 1px var(--amber-line);
      }

      .dot.gap {
        background: var(--gap-soft);
        box-shadow: inset 0 0 0 1px var(--line-strong);
      }

      .stage {
        margin-bottom: 20px;
      }

      .stage-head {
        display: flex;
        align-items: baseline;
        gap: 9px;
        width: 100%;
        padding: 9px 11px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }

      .stage-head:hover {
        background: rgba(255, 253, 248, 0.66);
      }

      .stage-no {
        flex: 0 0 auto;
        display: inline-grid;
        place-items: center;
        width: 21px;
        height: 21px;
        border-radius: 50%;
        background: var(--accent);
        color: #fff;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .stage-title {
        flex: 0 0 auto;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .stage-summary {
        min-width: 0;
        overflow: hidden;
        color: var(--ink-3);
        font-size: 11.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chev {
        margin-left: auto;
        color: var(--ink-3);
        font-size: 11px;
      }

      .stage-body {
        display: grid;
        gap: 9px;
        margin-left: 21px;
        padding-left: 16px;
        border-left: 1px solid var(--line);
      }

      .node-wrap {
        min-width: 0;
      }

      .node {
        position: relative;
        padding: 13px 15px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: var(--shadow);
        cursor: pointer;
        transition:
          border-color 0.14s ease,
          box-shadow 0.14s ease,
          transform 0.14s ease;
      }

      .node:hover {
        border-color: var(--line-strong);
        transform: translateY(-1px);
      }

      .node:focus-visible {
        outline: 3px solid var(--accent-soft);
        outline-offset: 1px;
      }

      .node.is-selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow);
      }

      .node.is-optional {
        border-left-style: dashed;
        border-left-color: var(--amber);
        background: linear-gradient(90deg, rgba(248, 236, 211, 0.28), var(--surface) 28%);
      }

      .node.is-gap {
        border-left-color: var(--gap);
        background: var(--surface-2);
        opacity: 0.78;
      }

      .node.is-incomplete {
        border-right: 3px solid var(--danger-soft);
      }

      .node-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
      }

      .node-label {
        font-size: 14.5px;
        font-weight: 590;
        letter-spacing: -0.01em;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 10px;
        line-height: 1.45;
        white-space: nowrap;
      }

      .badge.optional {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .badge.gap {
        background: var(--gap-soft);
        color: var(--gap);
      }

      .badge.incomplete {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .badge.count {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .badge.group {
        border: 1px solid var(--line);
        background: var(--surface-2);
        color: var(--ink-3);
      }

      .node-summary {
        margin: 6px 0 0;
        color: var(--ink-2);
        font-size: 12.5px;
        line-height: 1.62;
      }

      .node-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin-top: 7px;
        color: var(--ink-3);
        font-size: 10.5px;
      }

      .node-meta code {
        font-family: var(--mono);
        font-size: 10px;
      }

      .chev-btn {
        margin-left: auto;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid transparent;
        border-radius: 6px;
        background: transparent;
        color: var(--ink-3);
        font-size: 11px;
        cursor: pointer;
      }

      .chev-btn:hover {
        border-color: var(--line);
        background: var(--surface-2);
        color: var(--ink);
      }

      .butterfly-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        margin-top: 9px;
      }

      .butterfly-label {
        color: var(--ink-3);
        font-size: 10px;
        letter-spacing: 0.05em;
      }

      .butterfly {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: 4px 9px;
        border: 1px dashed var(--amber-line);
        border-radius: 999px;
        background: var(--amber-soft);
        color: var(--amber);
        font: inherit;
        font-size: 11.5px;
        line-height: 1.4;
        text-align: left;
        cursor: pointer;
      }

      .butterfly:hover,
      .butterfly.is-selected {
        border-style: solid;
        background: #f5e3bf;
      }

      .butterfly-mark {
        font-size: 11px;
      }

      .children {
        display: grid;
        gap: 9px;
        margin-top: 9px;
        margin-left: 17px;
        padding-left: 16px;
        border-left: 1px dashed var(--line-strong);
      }

      .detail-pane {
        position: sticky;
        top: 18px;
        max-height: calc(100vh - 36px);
        overflow: auto;
        padding: 18px 19px 22px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .detail-placeholder {
        padding: 20px 4px;
        color: var(--ink-3);
        font-size: 12.5px;
        line-height: 1.8;
      }

      .detail-placeholder strong {
        display: block;
        margin-bottom: 6px;
        color: var(--ink-2);
        font-size: 14px;
        font-weight: 560;
      }

      .detail-kind {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 5px;
      }

      .kind-tag {
        display: inline-flex;
        align-items: center;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 10.5px;
      }

      .kind-tag.butterfly {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .kind-tag.stage {
        background: var(--gap-soft);
        color: var(--ink-2);
      }

      .detail-title {
        margin: 0;
        font-size: 20px;
        font-weight: 570;
        letter-spacing: -0.025em;
        line-height: 1.35;
      }

      .breadcrumb {
        margin-top: 7px;
        color: var(--ink-3);
        font-size: 10.5px;
        line-height: 1.6;
      }

      .detail-summary {
        margin: 12px 0 0;
        color: var(--ink-2);
        font-size: 13px;
        line-height: 1.75;
      }

      .callout {
        margin: 11px 0 0;
        padding: 9px 11px;
        border-left: 3px solid var(--amber);
        border-radius: 6px;
        background: #f8f3e7;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.65;
      }

      .callout.gap {
        border-left-color: var(--gap);
        background: var(--gap-soft);
      }

      .callout.danger {
        border-left-color: var(--danger);
        background: var(--danger-soft);
      }

      .callout b {
        font-weight: 600;
      }

      .section-title {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin: 19px 0 7px;
        color: var(--ink-3);
        font-size: 10.5px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .section-title b {
        color: var(--ink-2);
        font-size: 12px;
        font-weight: 560;
        letter-spacing: 0;
        text-transform: none;
      }

      .note-list {
        margin: 0;
        padding-left: 18px;
        color: var(--ink-2);
        font-size: 12px;
        line-height: 1.7;
      }

      .note-list li + li {
        margin-top: 4px;
      }

      .detail-metrics {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

      .detail-metrics span {
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--surface-2);
        color: var(--ink-3);
        font-size: 10.5px;
      }

      .detail-metrics b {
        color: var(--ink);
        font-weight: 570;
        font-variant-numeric: tabular-nums;
      }

      .example {
        margin-top: 9px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #fffefa;
        overflow: hidden;
      }

      .example > summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 9px 11px;
        color: var(--ink-2);
        font-size: 11.5px;
        cursor: pointer;
        list-style: none;
      }

      .example > summary::-webkit-details-marker {
        display: none;
      }

      .example > summary::before {
        content: "▸";
        color: var(--ink-3);
        font-size: 10px;
      }

      .example[open] > summary::before {
        content: "▾";
      }

      .source {
        display: inline-flex;
        padding: 2px 6px;
        border-radius: 999px;
        font-size: 10px;
        white-space: nowrap;
      }

      .source.july {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .source.j918 {
        background: var(--amber-soft);
        color: var(--amber);
      }

      .range,
      .turn-count {
        color: var(--ink-3);
        font-size: 10.5px;
        font-variant-numeric: tabular-nums;
      }

      .ex-note {
        flex: 1 0 100%;
        color: var(--ink-3);
        font-size: 10.5px;
        line-height: 1.55;
      }

      .turns {
        display: grid;
        gap: 7px;
        padding: 0 11px 12px;
      }

      .turn {
        padding: 7px 10px;
        border-left: 2px solid var(--accent);
        border-radius: 0 6px 6px 0;
        background: var(--surface);
      }

      .turn.student {
        border-left-color: var(--amber);
        background: #fbf5e9;
      }

      .turn .role {
        display: block;
        margin-bottom: 2px;
        color: var(--ink-3);
        font-size: 9.5px;
        letter-spacing: 0.04em;
      }

      .turn p {
        margin: 0;
        color: var(--ink);
        font-size: 12.5px;
        line-height: 1.72;
        white-space: pre-wrap;
      }

      .link-list {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .link-chip {
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        color: var(--ink-2);
        font: inherit;
        font-size: 11px;
        cursor: pointer;
      }

      .link-chip:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      .empty {
        padding: 10px 0;
        color: var(--ink-3);
        font-size: 11.5px;
      }

      .hidden-by-filter {
        display: none !important;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
          padding: 8px 14px 28px;
        }

        .topbar {
          padding: 20px 14px 10px;
        }

        .detail-pane {
          position: static;
          max-height: none;
        }

        .stage-summary {
          display: none;
        }
      }

      @media (max-width: 620px) {
        .node {
          padding: 11px 12px;
        }

        .node-label {
          font-size: 13.5px;
        }

        .toolbar {
          position: static;
        }

        .children,
        .stage-body {
          margin-left: 8px;
          padding-left: 10px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <p class="eyebrow">只读原型 · 不会写入数据库</p>
      <h1>七月咨询稿 · 目的树</h1>
      <p class="lede" id="lede"></p>
      <div class="stats" id="stats"></div>
    </header>

    <main class="layout">
      <section class="tree-pane">
        <div class="toolbar">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="搜目的、示例原文、标签…"
            autocomplete="off"
          />
          <button class="btn" type="button" id="expand-all">全部展开</button>
          <button class="btn" type="button" id="collapse-all">全部收起</button>
          <label class="toggle"><input id="show-butterflies" type="checkbox" checked /> 显示蝴蝶</label>
          <label class="toggle"><input id="only-mainline" type="checkbox" /> 只看主线</label>
        </div>

        <div class="legend">
          <span class="legend-item"><i class="dot main"></i>主线目的</span>
          <span class="legend-item"><i class="dot optional"></i>可选支线</span>
          <span class="legend-item"><i class="dot butterfly"></i>情绪蝴蝶</span>
          <span class="legend-item"><i class="dot gap"></i>待补充</span>
        </div>

        <div id="tree"></div>
      </section>

      <aside class="detail-pane" id="detail"></aside>
    </main>

    <noscript>
      <div class="empty" style="margin: 20px 22px">
        这个页面需要浏览器执行脚本。如果脚本被禁用，左侧不会显示目的树。
      </div>
    </noscript>

    <script id="tree-data" type="application/json">__TREE_DATA__</script>
    <script>
      let DATA = null;
      try {
        DATA = JSON.parse(document.getElementById('tree-data').textContent);
      } catch (error) {
        DATA = null;
      }

      // 这是生成用的模板，本身不含数据。直接打开时给出明确提示，避免看到一片空白。
      if (!DATA) {
        document.getElementById('tree').innerHTML =
          '<div class="empty" style="padding: 24px">这是模板文件。请用浏览器打开同目录下的 <b>preview.html</b>；如果它不存在，先运行 <code>node prototype/consult-purpose-tree/generate.mjs</code>。</div>';
        throw new Error('preview template opened directly');
      }

      // 新版数据按模板组织；离线预览默认打开 activeTemplateId 对应的那套骨架。
      if (!DATA.tree && Array.isArray(DATA.templates)) {
        const active =
          DATA.templates.find((item) => item.id === DATA.meta.activeTemplateId) ||
          DATA.templates[0];
        if (!active) throw new Error('preview data has no template');
        DATA = {
          ...DATA,
          tree: active.tree,
          meta: {
            ...DATA.meta,
            stats: active.stats,
            note: active.description || DATA.meta.note
          }
        };
      }
      const state = {
        selected: null,
        showButterflies: true,
        onlyMainline: false,
        query: '',
        collapsed: new Set()
      };

      const nodeById = new Map();
      const parentById = new Map();

      function indexNode(node, parent) {
        nodeById.set(node.id, node);
        if (parent) parentById.set(node.id, parent);
        for (const butterfly of node.butterflies || []) {
          nodeById.set(butterfly.id, butterfly);
          parentById.set(butterfly.id, node);
        }
        for (const child of node.children || []) indexNode(child, node);
      }
      indexNode(DATA.tree, null);

      const treeEl = document.getElementById('tree');
      const detailEl = document.getElementById('detail');
      const searchEl = document.getElementById('search');

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, (character) => {
          switch (character) {
            case '&':
              return '&amp;';
            case '<':
              return '&lt;';
            case '>':
              return '&gt;';
            case '"':
              return '&quot;';
            default:
              return '&#39;';
          }
        });
      }

      function renderStats() {
        const stats = DATA.meta.stats;
        const items = [
          ['阶段', stats.stages],
          ['目的动作', stats.purposes],
          ['可选支线', stats.optional],
          ['情绪蝴蝶', stats.butterflies],
          ['示例组', stats.exampleGroups],
          ['话轮', stats.turns],
          ['空缺主题', stats.gaps]
        ];
        document.getElementById('stats').innerHTML = items
          .map(([label, value]) => `<span class="stat"><b>${value}</b>${label}</span>`)
          .join('');
        document.getElementById('lede').textContent = DATA.meta.note;
      }

      function nodeText(node) {
        const parts = [
          node.label,
          node.summary,
          node.purposeKey,
          node.branchCondition,
          ...(node.tags || []),
          ...(node.notes || [])
        ];
        for (const example of node.examples || []) {
          for (const turn of example.turns) parts.push(turn.text);
        }
        for (const butterfly of node.butterflies || []) {
          parts.push(butterfly.label, butterfly.summary, ...(butterfly.tags || []));
          for (const example of butterfly.examples || []) {
            for (const turn of example.turns) parts.push(turn.text);
          }
        }
        return parts.filter(Boolean).join(' ').toLowerCase();
      }

      function computeVisible() {
        const query = state.query.trim().toLowerCase();
        if (!query) return null;
        const visible = new Set();

        const addSubtree = (node) => {
          visible.add(node.id);
          for (const butterfly of node.butterflies || []) visible.add(butterfly.id);
          for (const child of node.children || []) addSubtree(child);
        };

        const visit = (node) => {
          if (node.kind === 'stage' && nodeText(node).includes(query)) {
            addSubtree(node);
            return true;
          }
          let hit = nodeText(node).includes(query);
          if (hit) {
            visible.add(node.id);
            for (const butterfly of node.butterflies || []) visible.add(butterfly.id);
          }
          for (const butterfly of node.butterflies || []) {
            if (nodeText(butterfly).includes(query)) {
              visible.add(butterfly.id);
              visible.add(node.id);
              hit = true;
            }
          }
          let childHit = false;
          for (const child of node.children || []) {
            if (visit(child)) childHit = true;
          }
          if (childHit) visible.add(node.id);
          return hit || childHit;
        };

        for (const stage of DATA.tree.children) visit(stage);
        return visible;
      }

      function exampleCount(node) {
        return (node.examples || []).length;
      }

      function badges(node) {
        const items = [];
        if (node.optional) items.push('<span class="badge optional">可选支线</span>');
        if (node.group) items.push('<span class="badge group">分组</span>');
        if (node.gap) items.push('<span class="badge gap">待补充</span>');
        if (node.incomplete) items.push('<span class="badge incomplete">原稿中断</span>');
        if (node.kind === 'purpose' && exampleCount(node) > 0) {
          items.push(`<span class="badge count">${exampleCount(node)} 组示例</span>`);
        }
        return items.join('');
      }

      function renderButterflies(node, visible) {
        if (!state.showButterflies || !(node.butterflies || []).length) return '';
        const query = state.query.trim().toLowerCase();
        const list = node.butterflies
          .filter((butterfly) => {
            if (!visible) return true;
            return visible.has(butterfly.id) || visible.has(node.id);
          })
          .map(
            (butterfly) => `
              <button
                class="butterfly ${state.selected === butterfly.id ? 'is-selected' : ''}"
                type="button"
                data-id="${esc(butterfly.id)}"
                title="${esc(butterfly.summary || butterfly.label)}"
              >
                <span class="butterfly-mark">🦋</span>${esc(butterfly.label)}
              </button>`
          )
          .join('');
        if (!list) return '';
        return `<div class="butterfly-row"><span class="butterfly-label">情绪垫</span>${list}</div>`;
      }

      function renderNode(node, visible) {
        if (node.kind !== 'purpose') return '';
        if (state.onlyMainline && node.optional) return '';
        if (visible && !visible.has(node.id)) return '';

        const collapsed = state.collapsed.has(node.id) && !state.query.trim();
        const children = collapsed
          ? []
          : (node.children || []).map((child) => renderNode(child, visible)).filter(Boolean);
        const hasChildren = (node.children || []).length > 0;
        const classes = ['node'];
        if (state.selected === node.id) classes.push('is-selected');
        if (node.optional) classes.push('is-optional');
        if (node.gap) classes.push('is-gap');
        if (node.incomplete) classes.push('is-incomplete');

        return `
          <div class="node-wrap">
            <article
              class="${classes.join(' ')}"
              data-id="${esc(node.id)}"
              tabindex="0"
              role="button"
              aria-label="${esc(node.label)}"
            >
              <div class="node-head">
                <span class="node-label">${esc(node.label)}</span>
                ${badges(node)}
                ${
                  hasChildren
                    ? `<button class="chev-btn" type="button" data-toggle="${esc(
                        node.id
                      )}" title="展开 / 收起">${collapsed ? '▸' : '▾'}</button>`
                    : ''
                }
              </div>
              <p class="node-summary">${esc(node.summary)}</p>
              <div class="node-meta">
                <code>${esc(node.purposeKey)}</code>
                <span>${exampleCount(node)} 组示例</span>
                ${
                  (node.butterflies || []).length
                    ? `<span>${node.butterflies.length} 个情绪垫</span>`
                    : ''
                }
                ${node.branchCondition ? '<span>有条件分支</span>' : ''}
              </div>
              ${renderButterflies(node, visible)}
            </article>
            ${children.length ? `<div class="children">${children.join('')}</div>` : ''}
          </div>`;
      }

      function renderStage(stage, index, visible) {
        const children = (stage.children || [])
          .map((child) => renderNode(child, visible))
          .filter(Boolean);
        if (!children.length) return '';
        const collapsed = state.collapsed.has(stage.id) && !state.query.trim();
        return `
          <section class="stage">
            <button class="stage-head" type="button" data-toggle="${esc(stage.id)}">
              <span class="stage-no">${index + 1}</span>
              <span class="stage-title">${esc(stage.label)}</span>
              <span class="stage-summary">${esc(stage.summary)}</span>
              <span class="chev">${collapsed ? '▸' : '▾'}</span>
            </button>
            ${collapsed ? '' : `<div class="stage-body">${children.join('')}</div>`}
          </section>`;
      }

      function renderTree() {
        const visible = computeVisible();
        treeEl.innerHTML = DATA.tree.children
          .map((stage, index) => renderStage(stage, index, visible))
          .filter(Boolean)
          .join('');
        if (!treeEl.innerHTML) {
          treeEl.innerHTML = '<div class="empty">没有匹配的节点。</div>';
        }
      }

      function rangeLabel(example) {
        const suffix = example.source === 'july' ? '段' : '轮';
        const span =
          example.to === example.from ? `${example.from}` : `${example.from}–${example.to}`;
        return `第 ${span} ${suffix}`;
      }

      function renderExample(example, index) {
        const open = index === 0 && example.turns.length <= 12 ? ' open' : '';
        const turns = example.turns
          .map(
            (turn) => `
              <div class="turn ${turn.role === 'student' ? 'student' : 'consultant'}">
                <span class="role">${turn.role === 'student' ? '学生' : '咨询师'}</span>
                <p>${esc(turn.text)}</p>
              </div>`
          )
          .join('');
        return `
          <details class="example"${open}>
            <summary>
              <span class="source ${example.source === 'july' ? 'july' : 'j918'}">${esc(
                example.sourceLabel
              )}</span>
              <span class="range">${rangeLabel(example)}</span>
              <span class="turn-count">${example.turns.length} 条</span>
              ${example.note ? `<span class="ex-note">${esc(example.note)}</span>` : ''}
            </summary>
            <div class="turns">${turns || '<div class="empty">没有解析到文本。</div>'}</div>
          </details>`;
      }

      function renderExamples(node) {
        const examples = node.examples || [];
        if (!examples.length) {
          if (node.group) {
            return '<div class="callout"><b>分组节点：</b>这里不直接挂原文，具体示例在下面的子目的里。</div>';
          }
          if (node.gap) {
            return '<div class="callout gap"><b>待补充：</b>原稿只有标题，还没有可用的原文示例。这里会是一个明确的空缺，而不是系统自拟话术。</div>';
          }
          return '<div class="empty">暂无示例。</div>';
        }
        return examples.map((example, index) => renderExample(example, index)).join('');
      }

      function renderChips(nodes) {
        if (!nodes.length) return '<div class="empty">无。</div>';
        return `<div class="link-list">${nodes
          .map(
            (node) =>
              `<button class="link-chip" type="button" data-id="${esc(node.id)}">${esc(
                node.label
              )}</button>`
          )
          .join('')}</div>`;
      }

      function renderDetail() {
        const node = state.selected ? nodeById.get(state.selected) : null;
        if (!node) {
          detailEl.innerHTML = `
            <div class="detail-placeholder">
              <strong>点一个节点，看它的目的和原文</strong>
              左侧是目的树：实线卡片是主线动作，虚线卡片是可选支线，🦋 是挂在节点上的情绪垫话。<br /><br />
              点目的节点，右侧会显示它的目的概括、分支条件、导演提示，以及来自不同咨询稿的原文示例组。示例保留学生原话，方便判断语气和上下文。
            </div>`;
          return;
        }

        const trail = (node.path || [])
          .slice(1)
          .map((id) => nodeById.get(id))
          .filter(Boolean)
          .map((item) => item.label)
          .join(' → ');

        const kindLabel =
          node.kind === 'butterfly' ? '情绪蝴蝶' : node.kind === 'stage' ? '阶段' : '目的动作';

        const metrics = [];
        if (node.kind === 'purpose') {
          metrics.push(`<span><b>${exampleCount(node)}</b> 组示例</span>`);
          const turns = (node.examples || []).reduce(
            (sum, example) => sum + example.turns.length,
            0
          );
          metrics.push(`<span><b>${turns}</b> 条话轮</span>`);
          if (node.group) metrics.push(`<span><b>${(node.children || []).length}</b> 个下一步</span>`);
          if (node.optional) metrics.push('<span>可选支线</span>');
          if (node.gap) metrics.push('<span>待补充</span>');
        }
        if (node.kind === 'butterfly') {
          metrics.push(`<span><b>${exampleCount(node)}</b> 组示例</span>`);
          for (const tag of node.tags || []) metrics.push(`<span>${esc(tag)}</span>`);
        }

        let body = `
          <div class="detail-kind">
            <span class="kind-tag ${esc(node.kind)}">${kindLabel}</span>
            ${node.gap ? '<span class="kind-tag" style="background:var(--gap-soft);color:var(--gap)">待补充</span>' : ''}
            ${node.incomplete ? '<span class="kind-tag" style="background:var(--danger-soft);color:var(--danger)">原稿中断</span>' : ''}
          </div>
          <h2 class="detail-title">${esc(node.label)}</h2>
          ${trail ? `<div class="breadcrumb">${esc(trail)}</div>` : ''}
          ${node.summary ? `<p class="detail-summary">${esc(node.summary)}</p>` : ''}
          ${metrics.length ? `<div class="detail-metrics">${metrics.join('')}</div>` : ''}
          ${
            node.branchCondition
              ? `<div class="callout"><b>分支条件：</b>${esc(node.branchCondition)}</div>`
              : ''
          }
          ${
            node.incomplete
              ? '<div class="callout danger"><b>注意：</b>原稿在这里中断，后续内容缺失。这里只保留已有部分，不补写。</div>'
              : ''
          }
        `;

        if ((node.notes || []).length) {
          body += `
            <div class="section-title"><b>导演提示 / 备注</b></div>
            <ul class="note-list">${node.notes.map((note) => `<li>${esc(note)}</li>`).join('')}</ul>`;
        }

        if (node.kind !== 'stage') {
          body += `
            <div class="section-title"><b>原文示例</b><span>${exampleCount(node)} 组</span></div>
            ${renderExamples(node)}`;
        }

        if ((node.butterflies || []).length) {
          body += `
            <div class="section-title"><b>挂在这个节点上的情绪垫</b><span>${
              node.butterflies.length
            } 个</span></div>
            ${renderChips(node.butterflies)}`;
        }

        if ((node.children || []).length) {
          body += `
            <div class="section-title"><b>下一步目的</b><span>${
              node.children.length
            } 个</span></div>
            ${renderChips(node.children)}`;
        }

        detailEl.innerHTML = body;
      }

      function select(id) {
        const node = nodeById.get(id);
        if (node) {
          for (const pathId of node.path || []) state.collapsed.delete(pathId);
        }
        state.selected = id;
        renderTree();
        renderDetail();
        if (window.innerWidth <= 980) {
          detailEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function toggleCollapse(id) {
        if (state.collapsed.has(id)) state.collapsed.delete(id);
        else state.collapsed.add(id);
        renderTree();
      }

      function collectCollapsible() {
        const ids = [];
        const visit = (node) => {
          if ((node.children || []).length) ids.push(node.id);
          for (const child of node.children || []) visit(child);
        };
        for (const stage of DATA.tree.children) visit(stage);
        return ids;
      }

      treeEl.addEventListener('click', (event) => {
        const toggle = event.target.closest('[data-toggle]');
        if (toggle) {
          event.preventDefault();
          event.stopPropagation();
          toggleCollapse(toggle.dataset.toggle);
          return;
        }
        const butterfly = event.target.closest('.butterfly');
        if (butterfly) {
          event.preventDefault();
          select(butterfly.dataset.id);
          return;
        }
        const card = event.target.closest('.node[data-id]');
        if (card) select(card.dataset.id);
      });

      treeEl.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        const card = event.target.closest('.node[data-id], .butterfly[data-id]');
        if (!card) return;
        event.preventDefault();
        select(card.dataset.id);
      });

      detailEl.addEventListener('click', (event) => {
        const chip = event.target.closest('[data-id]');
        if (chip) select(chip.dataset.id);
      });

      searchEl.addEventListener('input', () => {
        state.query = searchEl.value;
        renderTree();
      });

      document.getElementById('show-butterflies').addEventListener('change', (event) => {
        state.showButterflies = event.target.checked;
        renderTree();
      });

      document.getElementById('only-mainline').addEventListener('change', (event) => {
        state.onlyMainline = event.target.checked;
        renderTree();
      });

      document.getElementById('expand-all').addEventListener('click', () => {
        state.collapsed.clear();
        renderTree();
      });

      document.getElementById('collapse-all').addEventListener('click', () => {
        state.collapsed = new Set(collectCollapsible());
        renderTree();
      });

      renderStats();
      renderTree();
      renderDetail();
    </script>
  </body>
</html>
